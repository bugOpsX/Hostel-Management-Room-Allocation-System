# ========================================================
# Nginx Reverse Proxy Configuration for HMRAS
# Place in: /etc/nginx/sites-available/hmras.conf
# Enable: ln -s /etc/nginx/sites-available/hmras.conf /etc/nginx/sites-enabled/
# ========================================================

upstream hmras_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name hostel.yourdomain.edu;

    # Redirect all plain HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hostel.yourdomain.edu;

    # SSL Certificates (managed via Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/hostel.yourdomain.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hostel.yourdomain.edu/privkey.pem;

    # Secure SSL parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client body limit (align with Express limit)
    client_max_body_size 10M;

    # Static assets caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://hmras_backend;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # API and dynamic application routes
    location / {
        proxy_pass http://hmras_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check bypass
    location /api/health {
        proxy_pass http://hmras_backend;
        access_log off;
    }
}
